name: Sync Confluence → GitHub

on:
  # Run automatically every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Fetch Confluence pages and commit as Markdown
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Confluence sync script
        env:
          CONFLUENCE_BASE_URL:       ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL:          ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN:      ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY:      ${{ secrets.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
        run: python confluence_sync.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: sync Confluence articles [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
